name: C++ CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
  pull_request:
    paths:
      - '**/*.cpp'
      - '**/*.hpp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile all C++ files
        run: |
          for f in $(find . -name "*.cpp"); do
            g++ -std=c++17 -Wall -Wextra -fsyntax-only "$f" || exit 1
          done