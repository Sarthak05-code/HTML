name: Java CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.java"
  pull_request:
    paths:
      - "**/*.java"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Compile Java files
        run: |
          mkdir -p out
          find . -name "*.java" > sources.txt
          javac @sources.txt -d out

      - name: Run (optional)
        run: |
          echo "Build successful"
